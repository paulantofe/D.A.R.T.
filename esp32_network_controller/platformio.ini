[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200

board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps = 
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.12.1

lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP
